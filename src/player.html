<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <!-- 和编辑器同一套资源策略：积木渲染器 / media 走 tanloom://bundle，
       unsafe-eval 供代码视图的运行时使用（独立窗口里同样可能用到） -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' tanloom://bundle; style-src 'self' 'unsafe-inline' tanloom://bundle; script-src 'self' 'unsafe-eval' tanloom://bundle; img-src 'self' data: blob: tanloom://bundle; media-src 'self' tanloom://bundle; font-src 'self' tanloom://bundle; connect-src 'self' tanloom://bundle;" />
  <title data-i18n="Tanloom Engine 运行">Tanloom Engine 运行</title>
  <link rel="stylesheet" href="styles/player.css" />
</head>

<body>
  <!-- 独立运行窗口：只有一个舞台 + 一条会自动淡出的工具条。
       窗口里跑的是**另一份** Runtime（跨进程没法共享运行中的状态），
       项目数据由编辑器通过主进程推过来，改完即热重载。 -->
  <canvas id="player-canvas"></canvas>

  <div class="player-bar">
    <span class="player-name" id="player-name">Tanloom Engine</span>
    <span class="player-stat" id="player-fps">— fps</span>
    <span class="player-stat" id="player-frame">帧 0</span>
    <span class="player-spacer"></span>
    <button id="btn-player-restart" data-i18n-title="从头重新运行" title="从头重新运行">⟲ <span data-i18n="重来">重来</span></button>
    <button id="btn-player-pause" data-i18n-title="暂停 / 继续" title="暂停 / 继续">⏸ <span data-i18n="暂停">暂停</span></button>
    <button id="btn-player-fullscreen" data-i18n-title="窗口全屏 (F11)" title="窗口全屏 (F11)">⛶ <span data-i18n="全屏">全屏</span></button>
    <button id="btn-player-close" data-i18n-title="关闭这个窗口 (Esc)" title="关闭这个窗口 (Esc)">✕ <span data-i18n="关闭">关闭</span></button>
  </div>

  <div class="player-hint" id="player-hint"></div>

  <script type="module" src="player.js"></script>
</body>

</html>
